    description: All models in the test domain (silver layer). Managed by ERD Studio.
    definition:
      union:
        - method: fqn
          value: stg_loans
        - method: fqn
          value: stg_merchants
        - method: fqn
          value: stg_loan_applications
        - method: fqn
          value: stg_terminals
        - method: fqn
          value: stg_transactions
        - method: fqn
          value: stg_repayment_schedule
        - method: fqn
          value: stg_repayments
